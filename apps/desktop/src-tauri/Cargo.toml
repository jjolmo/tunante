[package]
name = "tunante"
version = "0.1.0"
edition = "2021"
description = "Cross-platform music player for video game music and standard audio formats"
# "or later" is required to link Slint (GPL-3.0-only) into tunante-mini. It is
# available to us because the vendored GPL cores are themselves "version 2 ... or
# (at your option) any later version" — see sexypsf and DeSmuME headers.
license = "GPL-2.0-or-later"

[lib]
name = "tunante_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["global-mouse"]
# Global mouse button shortcuts (Linux: evdev, macOS: CGEventTap).
# Disable with --no-default-features to skip the mouse listener overhead.
global-mouse = ["evdev", "core-graphics", "core-foundation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tunante-core = { path = "../../../crates/tunante-core" }
# The playback engine (device selection, unplug recovery, DSP over the source)
# — decoding happens out of process in tunante-decoder since fase 1 of
# docs/plan-desktop-slint.md, so rodio is no longer a direct dependency here.
tunante-audio = { path = "../../../crates/tunante-audio" }
# Still linked, but only for the metadata readers/writers (tags, ratings,
# vgmstream_accepts). Playback stopped coming through here.
tunante-codec = { path = "../../../crates/tunante-codec" }
tunante-art = { path = "../../../crates/tunante-art" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
log = "0.4"
thiserror = "2"
parking_lot = "0.12"
base64 = "0.22"
notify = { version = "7", features = ["macos_kqueue"] }
# The decoders, the metadata readers and every vendored emulator core now come in
# through tunante-codec — this crate no longer links them directly.
reqwest = { version = "0.13.2", features = ["json"] }
urlencoding = "2"
png = "0.17"
open = "5.3.3"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Not for the types: the patched crate exposes `set_symbolic_icon`, which is the
# only way to publish the tray icon by name so KDE, GNOME and Cinnamon can
# recolour it. `tauri::tray` offers `icon(Image)` and nothing else.
#
# default-features = false is load-bearing. tray-icon's default feature set
# includes `libxdo`, and Tauri deliberately keeps that behind an opt-in of its
# own — so adding this dependency with defaults on quietly turned libxdo on for
# the whole build through feature unification, and both Linux release jobs died
# at link time with `cannot find -lxdo`. Nothing here needs it: the only thing
# this dependency is for is one free function.
tray-icon = { version = "0.21", default-features = false }
evdev = { version = "0.13.2", optional = true }
gio = "0.18"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", optional = true }
core-foundation = { version = "0.10", optional = true }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.21"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.1"

