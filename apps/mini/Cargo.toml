[package]
name = "tunante-mini"
version = "0.1.0"
edition = "2021"
description = "Tunante for the phone: native Slint UI, no webview"
license = "GPL-2.0-or-later"

[[bin]]
name = "tunante-mini"
path = "src/main.rs"

[dependencies]
tunante-core = { path = "../../crates/tunante-core", default-features = false }

# The playback engine, shared with the desktop app since fase 3a of
# docs/plan-desktop-slint.md: the same out-of-process decoding this app proved
# on the phone, plus output-device selection, unplug recovery and the DSP
# chain over every source. rodio stopped being a direct dependency here — the
# engine owns it (and brings core's `dsp` feature along).
tunante-audio = { path = "../../crates/tunante-audio" }

# The client for the tunante-decoder helper: probe, artwork and PCM over a pipe.
# Shared with tunante-android, which needs exactly the same thing.
tunante-helper = { path = "../../crates/tunante-helper" }
tunante-art = { path = "../../crates/tunante-art" }

serde_json = "1"
walkdir = "2"
# Override ids for the classification corrections, same shape the desktop
# writes.
uuid = { version = "1", features = ["v4"] }

# One syscall: sched_setattr, to raise this thread's uclamp.min. See src/boost.rs
# — it is worth 68 fps against 112 on the phone, and there is no std API for it.

# Lock-screen controls and headset buttons. Not a luxury on this phone: the
# 3.5 mm jack has no driver, so headphones mean Bluetooth, and the only controls
# in reach are the ones on the headset. zbus is already in the tree via Slint.
# For the logind sleep inhibitor in src/inhibit.rs. Already in the tree behind
# mpris-server; named here because a direct use deserves a direct dependency.

# Cover art arrives as a base64 data URI and Slint only takes a file path or
# decoded pixels, so it is decoded here. Two formats: everything embedded in an
# audio tag is JPEG or PNG, and pulling in AVIF or WebP decoders for cover art
# would cost more than the feature.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

# Two renderers, chosen at run time with SLINT_BACKEND.
#
# femtovg draws on the GPU through GLES2 and is the default: Slint picks it over
# the software renderer on its own when both are compiled in. Measured on the
# phone (Poco X3, Adreno 618, 1080x2400 panel at 120 Hz), flinging a 2000-row
# list and counting only the inertia animation, no finger down:
#
#     femtovg   38-43 fps
#     software  20-23 fps
#
# Roughly double. Neither reaches 120 — redrawing 2.6 million pixels is not free
# either way — but 40 fps of inertia reads as smooth and 20 reads as stuttering.
#
# Do not measure this with SLINT_DEBUG_PERFORMANCE=refresh_full_speed and call
# it scroll performance: that mode redraws unconditionally and flatters both
# renderers (46-50 vs 29-33). And during a finger-down drag Slint redraws once
# per touch event, so a synthetic uinput drag measures the test harness's event
# rate, not the app.
#
# renderer-software stays compiled in as the way out. It needs no GPU API at
# all, so if freedreno or Turnip misbehave on a given device the app still runs:
# `SLINT_BACKEND=winit-software`.
#
# backend-winit covers Wayland and X11 so the same source runs on a desktop
# while developing; the Alpine package should narrow it to
# `backend-winit-wayland`, which is smaller and forces the Wayland path.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }

# Everything freedesktop. MPRIS is a D-Bus specification and logind is a
# systemd service, so neither has a meaning on Windows or macOS; `libc` is here
# only for `sched_setattr`, which is a Linux syscall. The modules that use them
# are gated to match, and each keeps a stub with the same signature so the event
# loop in main.rs does not have to know.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The system tray, behind the `tray` feature: a desktop nicety, and the phone
# builds (Alpine/musl, the APKBUILD) switch it off with --no-default-features,
# which also keeps GTK out of that image. default-features = false on
# tray-icon is load-bearing for the same reason it is in the desktop app: the
# default set includes libxdo, whose absence at link time killed release jobs
# before. The workspace [patch] swaps in vendor/tray-icon-patch. GTK is only
# for the tray's own thread — the shell stays winit.
tray-icon = { version = "0.21", default-features = false, optional = true }
gtk = { version = "0.18", optional = true }
# Self-update from GitHub releases, behind the `updater` feature for the same
# reason the tray hides behind its own: the Alpine package updates through
# apk, and a package-managed binary must not overwrite itself. Same ureq the
# art crate already brought into the tree.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"], optional = true }
mpris-server = "0.10"
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
futures-lite = "2"

[features]
default = ["tray", "updater"]
tray = ["dep:tray-icon", "dep:gtk"]
updater = ["dep:ureq"]

[build-dependencies]
slint-build = "1.17"
