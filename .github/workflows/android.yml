name: tunante-android (arm64-v8a)

# Builds the Android app and attaches the APK to the release.
#
# Unlike mini.yml this is a real cross-compile, so it runs on an ordinary x86_64
# runner: no aarch64 runner, no Alpine container, no docker. The NDK produces
# aarch64 binaries from an x86_64 host, which is what it is for.
#
# What this workflow does NOT do is run the format smoke test on Android. It
# cannot: there is no arm64 Android to run it on here, and the x86_64 emulator
# would be testing different C — lazyusf2 turns on ARCH_MIN_SSE2 for x86_64 and
# DeSmuME's resampler takes its SSE branch. A green emulator run would say
# nothing about the phone. The correctness bar stays where it already is:
# mini.yml runs the codec tests, and the Android cores are exercised on a device
# by hand.

on:
  # No path filter on main, on purpose.
  #
  # release.yml publishes on every push here, so a filtered build meant most
  # releases carried no APK -- including, usually, the newest one, which is what
  # the releases page shows first. "I don't see the apk" is the correct reading
  # of that page, and the release notes telling you to scroll for an older
  # release that has one is a worse answer than just building it.
  #
  # It costs about nine minutes of runner per release. The desktop side already
  # builds three platforms.
  # On the tag, not on main. release.yml is manual now, and the tag it pushes
  # is what says a release is happening — so this fires exactly when there is
  # something to attach itself to, and never on an ordinary commit.
  # After Release finishes, not on the tag it pushes.
  #
  # A tag pushed by a job using GITHUB_TOKEN does not trigger anything: GitHub
  # refuses to start workflows from events its own token created, to stop a
  # workflow from looping. Triggering on the tag therefore meant never
  # triggering at all — the release came out with the desktop builds and
  # nothing else, silently.
  #
  # `workflow_run` is exempt from that rule, and it also fixes the ordering
  # these jobs used to work around: the release now exists before they look for
  # it, instead of them polling for one that is still being built.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  # On a pull request the filter still makes sense: nothing is published, and a
  # change to the Svelte frontend has nothing to say about an Android build.
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/*-rs/**'
      - 'vendor/*-patch/**'
      - 'vendor/viogsf/**'
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# To attach the apk to the release. Read-only is the default for everything else.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # r28 and up align to 16 KB pages by default, which is the Play publishing
  # gate from February 2027 and the page size of newer devices. r27 is the
  # current LTS and would need the flag passed by hand.
  NDK_VERSION: 28.0.13004108

jobs:
  build:
    # Nothing to attach to if the release that triggered this one failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    name: APK (arm64-v8a)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The commit the release was built from, not the tip of main.
          #
          # A workflow_run checkout defaults to the default branch's HEAD, and
          # main moves. It moved between the release starting and these jobs
          # running, so `git tag --points-at HEAD` found nothing and every
          # artifact was left unattached — a green run that shipped nothing.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The version comes from the tags, as everywhere else here.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the NDK
        run: |
          # The runner ships an Android SDK already; it just may not have the
          # NDK version we want.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust for Android
        run: rustup target add aarch64-linux-android

      # The vendored C is most of the build time, so it is worth keeping.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-${{ runner.os }}-

      - name: cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      # No compiler checks this. A `native` method Java declares and Rust does
      # not export links fine, builds fine, installs fine, and throws
      # UnsatisfiedLinkError the first time a finger touches it — and only on
      # the screen that calls it. It is the one seam in this design with no
      # type system across it, so it gets a test instead.
      - name: The JNI bridge matches on both sides
        run: |
          grep -oE 'native[A-Z][A-Za-z]+\(' \
            apps/android/app/src/main/java/com/tunante/android/NativeBridge.java \
            | tr -d '(' | sort -u > /tmp/java.txt
          grep -oE 'NativeBridge_native[A-Za-z]+' \
            apps/android/rust/src/lib.rs \
            | sed 's/.*NativeBridge_//' | sort -u > /tmp/rust.txt

          echo "declared in Java: $(wc -l < /tmp/java.txt), exported from Rust: $(wc -l < /tmp/rust.txt)"
          missing=$(comm -23 /tmp/java.txt /tmp/rust.txt)
          if [ -n "$missing" ]; then
            echo "declared in Java with nothing behind it — UnsatisfiedLinkError at runtime:"
            echo "$missing" | sed 's/^/   /'
            exit 1
          fi
          dead=$(comm -13 /tmp/java.txt /tmp/rust.txt)
          if [ -n "$dead" ]; then
            echo "::warning::exported from Rust and never declared in Java: $(echo $dead | tr '\n' ' ')"
          fi

      # Signed with a stable key when one is configured, so an APK from a
      # release installs *over* the previous one. Without it Android refuses —
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE — and the only way through is to
      # uninstall, losing the scanned library.
      # Wait for the tag that points at *this* commit before naming anything.
      #
      # `git describe --tags` was what this used, and the first time the step
      # ever ran on main it produced tunante-android-0.1.261.apk from 0.1.262's
      # code and hung it off the previous release. release.yml creates the tag
      # in its first job, which can easily finish after this job has already
      # checked out -- so describe returns the newest tag this clone happens to
      # know, which is the one before. The wrong number is worse than the wrong
      # place: an asset that lies about which build it is cannot be told apart
      # from a good one later.
      #
      # `--points-at HEAD` cannot make that mistake: either the tag for this
      # commit exists or there is none, and a push that is not a release is
      # exactly the case that should fall through to the default.
      - name: Wait for this commit's tag
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          for _ in $(seq 1 30); do
            git fetch -q --tags origin 2>/dev/null || true
            TAG=$(git tag --points-at HEAD | head -1)
            [ -n "$TAG" ] && break
            echo "waiting for release.yml to tag this commit…"
            sleep 20
          done
          if [ -z "$TAG" ]; then
            echo "no tag appeared for this commit"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "this commit is $TAG"
          fi

      - name: Unpack the signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; building a debug APK, which cannot be installed over a previous release."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tunante.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: apps/android
        # Only the phone's ABI. build.sh also knows how to build x86_64, which
        # exists so the interface can be looked at in an emulator — nobody
        # installs this from a release onto an emulator, and building the whole
        # vendored C tree twice would double a job that is mostly C.
        env:
          ABIS: arm64-v8a
          # The version goes *into* the APK here, not just into its filename.
          TUNANTE_VERSION: ${{ steps.tag.outputs.tag }}
          TUNANTE_KEYSTORE: ${{ steps.key.outputs.signed == 'true' && format('{0}/tunante.jks', runner.temp) || '' }}
          TUNANTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Debug rather than an unsigned release when there is no key: an
          # unsigned release APK does not install at all, which is worse than
          # one that installs and merely cannot be upgraded over.
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            ./build.sh assembleRelease
          else
            ./build.sh assembleDebug
          fi

      - name: Where the APK ended up
        id: apk
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            echo "path=apps/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=apps/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: What is actually inside it
        working-directory: apps/android
        run: |
          # ../.. — working-directory is apps/android and the path is repo-relative.
          APK=../../${{ steps.apk.outputs.path }}
          echo "== $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a|assets/' | sed 's/^/   /'

          # The whole design rests on the decoder being a real, extractable,
          # executable ELF inside the APK. If packaging ever silently drops it
          # or compresses it into something unextractable, this is where it
          # should be caught — not on a phone.
          mkdir -p /tmp/apk && unzip -o -q "$APK" 'lib/arm64-v8a/*' -d /tmp/apk
          file /tmp/apk/lib/arm64-v8a/libtunante_decoder.so | tee /tmp/kind
          grep -q 'ARM aarch64' /tmp/kind \
            || { echo "the decoder in the APK is not an aarch64 binary"; exit 1; }
          for lib in libtunante_android.so libtunante_decoder.so libc++_shared.so; do
            test -f "/tmp/apk/lib/arm64-v8a/$lib" \
              || { echo "missing from the APK: $lib"; exit 1; }
          done

      - name: Name it after the version
        id: name
        run: |
          VERSION=$(echo "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
          VERSION=${VERSION:-0.1.0}
          cp "${{ steps.apk.outputs.path }}" "tunante-android-$VERSION.apk"
          echo "file=tunante-android-$VERSION.apk" >> "$GITHUB_OUTPUT"
          # Distinct from the Alpine package on purpose. Both formats are called
          # ".apk", both hang off the same tag, and only one of them installs on
          # a phone — tunante-<v>-r0.apk is the Alpine one.
          ls -l "tunante-android-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tunante-android-arm64
          path: ${{ steps.name.outputs.file }}

      # And onto the release, so it is installable without a GitHub account:
      # an artifact needs an authenticated API call and expires, and the phone
      # has to be able to just fetch a URL.
      - name: Attach it to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "no tag for this commit; leaving the artifact as the only copy"
            exit 0
          fi

          # release.yml publishes the release only after its desktop builds, so
          # it can still be in flight. Wait rather than fail — the alternative is
          # a release missing its phone package for no better reason than job
          # ordering. Same reasoning as mini.yml.
          for _ in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG…"
            sleep 20
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG never appeared; leaving the artifact as the only copy"
            exit 0
          fi

          gh release upload "$TAG" "${{ steps.name.outputs.file }}" --clobber
          echo "attached to $TAG"

          if [ "${{ steps.key.outputs.signed }}" != "true" ]; then
            echo "::warning::Debug key: this APK will not install over a previous release."
          fi
