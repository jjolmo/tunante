name: Release

on:
  push:
    branches:
      - main
    # A change to prose does not need four runners and a version bump. Only
    # paths-ignore, never paths: this workflow must fire for everything else,
    # and a `paths:` allowlist would silently stop releasing whatever nobody
    # remembered to add to it.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshot.png'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump patch version
        id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          HEAD_TAG=$(git tag --points-at HEAD 2>/dev/null | head -1)
          if [ -n "$HEAD_TAG" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Stamp version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
          # The phone app and its Alpine package, which were left out and so
          # still claimed 0.1.0 while the tags had reached 0.1.246.
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" \
            apps/mini/Cargo.toml
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" \
            apps/mini/dist/APKBUILD
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev libasound2-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm install -g @tauri-apps/cli
      - name: Music format smoke test
        run: cargo test -p tunante-codec -p tunante-decoder --release -- --nocapture
      - name: Build
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@v4
        with:
          name: tunante-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb

  build-windows:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    name: Windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Stamp version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm install -g @tauri-apps/cli
      - name: Music format smoke test
        run: cargo test -p tunante-codec -p tunante-decoder --release -- --nocapture
      - name: Build
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@v4
        with:
          name: tunante-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig

  build-macos:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: macos-latest
    name: macOS aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Stamp version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/package.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm install -g @tauri-apps/cli
      - name: Music format smoke test
        run: cargo test -p tunante-codec -p tunante-decoder --release -- --nocapture
      - name: Build
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          MACOSX_DEPLOYMENT_TARGET: '11.0'
      - uses: actions/upload-artifact@v4
        with:
          name: tunante-macos-aarch64
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig

  release:
    needs: [version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Prepare release files and generate latest.json
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" \) -exec cp {} release/ \;

          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/jjolmo/tunante/releases/download/$TAG"

          # Read signatures
          read_sig() { [ -f "$1" ] && cat "$1" || echo ""; }

          APPIMAGE_AMD64=$(ls release/*amd64*.AppImage 2>/dev/null | head -1 || true)
          APPIMAGE_ARM64=$(ls release/*arm64*.AppImage 2>/dev/null | head -1 || true)
          MSI=$(ls release/*.msi 2>/dev/null | grep -v '.sig' | head -1 || true)
          NSIS=$(ls release/*.exe 2>/dev/null | grep -v '.sig' | head -1 || true)
          MACOS_ARM_TAR=$(ls release/*.app.tar.gz 2>/dev/null | grep -v '.sig' | head -1 || true)

          name_or_none() { [ -n "$1" ] && basename "$1" || echo "none"; }

          cat > release/latest.json << ENDJSON
          {
            "version": "$VERSION",
            "notes": "Release $TAG",
            "pub_date": "$DATE",
            "platforms": {
              "linux-x86_64": {
                "signature": "$(read_sig "${APPIMAGE_AMD64}.sig")",
                "url": "$BASE_URL/$(name_or_none "$APPIMAGE_AMD64")"
              },
              "linux-aarch64": {
                "signature": "$(read_sig "${APPIMAGE_ARM64}.sig")",
                "url": "$BASE_URL/$(name_or_none "$APPIMAGE_ARM64")"
              },
              "windows-x86_64": {
                "signature": "$(read_sig "${MSI}.sig")",
                "url": "$BASE_URL/$(name_or_none "$MSI")"
              },
              "darwin-aarch64": {
                "signature": "$(read_sig "${MACOS_ARM_TAR}.sig")",
                "url": "$BASE_URL/$(name_or_none "$MACOS_ARM_TAR")"
              }
            }
          }
          ENDJSON
          cp apps/desktop/update_mac.sh release/
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Tunante ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # A short guide to the assets, above the generated changelog.
          #
          # Two of them are called ".apk" and only one installs on a phone:
          # tunante-android-<v>.apk is the Android app, tunante-mini-<v>-r0.apk
          # is an Alpine package for postmarketOS. The android.yml comment has
          # warned about that confusion since it was written; the person it
          # confuses is the one reading this page, so it belongs here.
          #
          # Both phone builds are attached by their own workflows, which are
          # path filtered, so a given release may carry neither. Said plainly
          # rather than left to be discovered.
          body: |
            | Asset | What it is |
            |---|---|
            | `.AppImage` / `.deb` | Linux desktop |
            | `.dmg` | macOS desktop (unsigned — see the README) |
            | `.msi` / `-setup.exe` | Windows desktop |
            | `tunante-android-*.apk` | **Android phone.** Sideload; not on Play |
            | `tunante-mini-*-r0.apk` | postmarketOS package, *not* an Android app |

            The two phone builds ship only when their own code changed, so a
            release may not have them. Take the newest release that does.
          files: release/*
