name: Release

# Only when asked. Publishing on every push meant every commit spent about
# forty minutes of runner and left a tag behind whether or not anything was
# worth shipping — and a failed build left the tag anyway, which is where
# v0.1.278 through v0.1.283 came from.
#
#     gh workflow run release.yml
#
# The bump and the tag stay inside this workflow, so that one command still
# does the whole thing: it tags, creates the release, and the tag push is
# what starts the real builds — tunante.yml (Linux tarballs, the Windows zip,
# the Alpine package) and tunante-android.yml — which then attach themselves to it.
#
# The Tauri desktop jobs that used to live here are gone with the app they
# built: the Slint player *is* the
# desktop app now, and its builds were always tunante.yml's. The last Tauri
# release remains v0.1.283; anyone on an AppImage moves to the tarball by
# hand once — the release notes say so.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: 'Exact version to release (e.g. 0.9.1); when set, bump is ignored'
        type: string
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump the version
        id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          HEAD_TAG=$(git tag --points-at HEAD 2>/dev/null | head -1)
          if [ -n "$HEAD_TAG" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "${{ inputs.bump || 'patch' }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac
          # An explicit version wins over the bump: the jump from 0.4 to 0.9.1
          # was a decision, not a patch.
          if [ -n "${{ inputs.version }}" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${{ inputs.version }}"
          fi
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  # The release has to exist before the builds go looking for it: tunante.yml
  # and tunante-android.yml fire on the tag and poll `gh release view` until this
  # job has done its part.
  release:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Tunante ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # A short guide to the assets, above the generated changelog.
          #
          # Two of them are called ".apk" and only one installs on a phone:
          # tunante-android-<v>.apk is the Android app, tunante-<v>-r0.apk
          # is an Alpine package for postmarketOS. The tunante-android.yml comment has
          # warned about that confusion since it was written; the person it
          # confuses is the one reading this page, so it belongs here.
          #
          # Every build is attached by its own workflow, which may be path
          # filtered, so a given release can arrive before its assets do —
          # or, for the phones, without them. Said plainly rather than left
          # to be discovered.
          body: |
            | Asset | What it is |
            |---|---|
            | `tunante-*-linux-gnu.tar.gz` | **Linux desktop.** Unpack, run `tunante`; it self-updates from here on (`--update`, or Ajustes) |
            | `tunante-*-windows.zip` | Windows desktop |
            | `tunante-android-*.apk` | **Android phone.** Sideload; not on Play |
            | `tunante-*-r0.apk` | postmarketOS package, *not* an Android app |

            One player, every screen: wide window (or `--desktop`) is the
            desktop shell, narrow is the phone one.

            Coming from the old Tauri desktop (`.AppImage`/`.deb`/`.dmg`/`.msi`,
            last shipped in v0.1.283)? Move once by hand to the tarball — it
            opens the same library and settings — and updates take care of
            themselves afterwards.

            Assets are attached by their own workflows and can take a few
            minutes to appear; the phone builds ship only when their code
            changed, so take the newest release that has them.
