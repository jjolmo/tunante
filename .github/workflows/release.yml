name: Release

# Only when asked. Publishing on every push meant every commit spent about
# forty minutes of runner and left a tag behind whether or not anything was
# worth shipping — and a failed build left the tag anyway, which is where
# v0.1.278 through v0.1.283 came from.
#
#     gh workflow run release.yml
#
# The bump and the tag stay inside this workflow, so that one command still
# does the whole thing: it tags, and the tag push is what starts the phone
# builds, which then attach themselves to it.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump patch version
        id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          HEAD_TAG=$(git tag --points-at HEAD 2>/dev/null | head -1)
          if [ -n "$HEAD_TAG" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Stamp version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
          # The phone app and its Alpine package, which were left out and so
          # still claimed 0.1.0 while the tags had reached 0.1.246.
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" \
            apps/mini/Cargo.toml
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" \
            apps/mini/dist/APKBUILD
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev libasound2-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm install -g @tauri-apps/cli
      - name: Music format smoke test
        run: cargo test -p tunante-codec -p tunante-decoder --release -- --nocapture
      - name: Build
        run: npm run tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: tunante-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  build-windows:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    name: Windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Stamp version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm install -g @tauri-apps/cli
      - name: Music format smoke test
        run: cargo test -p tunante-codec -p tunante-decoder --release -- --nocapture
      - name: Build
        run: npm run tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: tunante-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  build-macos:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon. For Intel the label is
          # `macos-15-intel`, and getting this wrong is invisible rather than
          # loud: `macos-13` was retired on 4 December 2025, and a job asking
          # for a label that does not exist does not fail — it queues, forever.
          # That is exactly what this job did every time until someone went
          # looking for why it had never once finished.
          #
          # GitHub drops x86_64 macOS entirely when the macOS 15 image retires
          # in autumn 2027, so this line has a known expiry date.
          #
          # Native on each rather than cross-compiling or a universal binary:
          # the vendored emulator cores are C and cmake, and a universal build
          # would double the size of every download for one architecture.
          - arch: aarch64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    name: macOS ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Stamp version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/package.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm install -g @tauri-apps/cli
      - name: Music format smoke test
        run: cargo test -p tunante-codec -p tunante-decoder --release -- --nocapture
      - name: Build
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
      - uses: actions/upload-artifact@v4
        with:
          name: tunante-macos-${{ matrix.arch }}
          path: target/release/bundle/dmg/*.dmg

  release:
    needs: [version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Collect the release files
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" \
               -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release/ \;
          cp apps/desktop/update_mac.sh release/
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Tunante ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # A short guide to the assets, above the generated changelog.
          #
          # Two of them are called ".apk" and only one installs on a phone:
          # tunante-android-<v>.apk is the Android app, tunante-mini-<v>-r0.apk
          # is an Alpine package for postmarketOS. The android.yml comment has
          # warned about that confusion since it was written; the person it
          # confuses is the one reading this page, so it belongs here.
          #
          # Both phone builds are attached by their own workflows, which are
          # path filtered, so a given release may carry neither. Said plainly
          # rather than left to be discovered.
          body: |
            | Asset | What it is |
            |---|---|
            | `.AppImage` / `.deb` | Linux desktop |
            | `.dmg` | macOS desktop (unsigned — see the README) |
            | `.msi` / `-setup.exe` | Windows desktop |
            | `tunante-android-*.apk` | **Android phone.** Sideload; not on Play |
            | `tunante-mini-*-r0.apk` | postmarketOS package, *not* an Android app |

            The two phone builds ship only when their own code changed, so a
            release may not have them. Take the newest release that does.
          files: release/*
