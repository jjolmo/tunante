name: tunante

# tunante is not a postmarketOS app that happens to compile elsewhere. It
# is the third Tunante, and nothing in its source knows what a distribution is —
# `backend-winit` covers Wayland and X11, so the same binary runs on a phone and
# on a desktop.
#
# So this builds it three ways:
#   * glibc x86_64 and aarch64, the ordinary Linux binaries most people want
#   * Windows x86_64
#   * Alpine/musl aarch64, which is how the phone actually builds it
# and packages the last one as an Alpine .apk.
#
# Separate from release.yml on purpose. That workflow builds the desktop app for
# glibc targets and auto-bumps a tag on every push; this one only has to answer
# "does the mobile build still compile and pass its format tests", which is a
# different question with a different failure mode.

on:
  # No path filter on main, deliberately. release.yml fires on every push
  # there, so filtering here produced releases carrying the desktop builds and
  # nothing else — and the assets are attached to that release's tag, so
  # "download the latest" quietly meant "the latest that happens to have them".
  # Three extra jobs per release is the price of a release meaning one thing.
  # On the tag, not on main. release.yml is manual now, and the tag it pushes
  # is what says a release is happening — so this fires exactly when there is
  # something to attach itself to, and never on an ordinary commit.
  # After Release finishes, not on the tag it pushes.
  #
  # A tag pushed by a job using GITHUB_TOKEN does not trigger anything: GitHub
  # refuses to start workflows from events its own token created, to stop a
  # workflow from looping. Triggering on the tag therefore meant never
  # triggering at all — the release came out with the desktop builds and
  # nothing else, silently.
  #
  # `workflow_run` is exempt from that rule, and it also fixes the ordering
  # these jobs used to work around: the release now exists before they look for
  # it, instead of them polling for one that is still being built.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  # On a pull request the filter still makes sense: nothing is published, and a
  # change to the desktop frontend has nothing to say about the Slint player.
  pull_request:
    paths:
      - 'apps/tunante/**'
      - 'crates/**'
      - 'vendor/*-rs/**'
      - 'vendor/*-patch/**'
      - '.github/workflows/tunante.yml'
  workflow_dispatch:

# To attach the apk to the release. Read-only is the default for everything
# else, which is what a build workflow wants.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The ordinary Linux builds. Anyone who wants a small, GPU-drawn player
  # without a web view can run this on a desktop — it is not phone-only.
  linux:
    # Nothing to attach to if the release that triggered this one failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Linux ${{ matrix.arch }} (glibc)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The commit the release was built from, not the tip of main.
          #
          # A workflow_run checkout defaults to the default branch's HEAD, and
          # main moves. It moved between the release starting and these jobs
          # running, so `git tag --points-at HEAD` found nothing and every
          # artifact was left unattached — a green run that shipped nothing.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # release.yml now commits the version bump and tags *that* commit, so the
      # commit the release was asked from (head_sha) is one behind the tag.
      # Move to the tag: the tree with the bumped version, and the one
      # `git tag --points-at HEAD` below will name. Newest tag as the fallback,
      # for a release that needed no bump commit and a main that moved since.
      - name: Move to the release's tag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch -q --tags origin main
          TAG=$(git tag --points-at origin/main | head -1)
          [ -z "$TAG" ] && TAG=$(git tag --sort=-creatordate | head -1)
          if [ -n "$TAG" ]; then
            git checkout -q "$TAG" && git submodule update -q --init --recursive 2>/dev/null || true
            echo "at $TAG ($(git rev-parse --short HEAD))"
          else
            echo "no tag to move to; staying on $(git rev-parse --short HEAD)"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: mini-${{ matrix.arch }}
          cache-on-failure: true

      # fontconfig for Slint's text, ALSA for rodio, cmake and a C toolchain for
      # the vendored emulator cores. No GL or Wayland packages: winit and femtovg
      # dlopen those at runtime, so a build host does not need them and a machine
      # without them fails with a message rather than at link time.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig1-dev libasound2-dev zlib1g-dev

      # The tag exists before this workflow starts (workflow_run fires after
      # Release completes), so the binary can carry its release version. A
      # dispatch or PR run has no tag and builds unstamped — update.rs then
      # reports the workspace placeholder and skips the silent update check.
      - name: Stamp the release version into the build
        if: github.event_name != 'pull_request'
        run: |
          git fetch -q --tags origin 2>/dev/null || true
          TAG=$(git tag --points-at HEAD | head -1)
          [ -n "$TAG" ] && echo "TUNANTE_VERSION=${TAG#v}" >> "$GITHUB_ENV" \
            || echo "no tag; building unstamped"

      - name: Build
        run: cargo build --release -p tunante -p tunante-decoder

      # The same bar as the Alpine job: every emulator backend decodes a real
      # fixture to something that is not silence.
      - name: Music format smoke test
        run: cargo test --release -p tunante-codec -p tunante-decoder -- --nocapture

      - name: What was actually built
        run: |
          for b in tunante tunante-decoder; do
            f="target/release/$b"
            echo "== $b  ($(stat -c%s "$f") bytes)"
            file "$f"
            # Dynamically linked on purpose: ALSA dlopens its PCM modules and
            # Slint needs dlopen for the GL driver, so a fully static binary
            # would build here and fail on the user's machine.
            ldd "$f" | head -12
          done

      - name: Tarball
        id: pack
        run: |
          NAME="tunante-${{ matrix.arch }}-linux-gnu"
          mkdir -p "dist/$NAME"
          cp target/release/tunante target/release/tunante-decoder "dist/$NAME/"
          cp apps/tunante/dist/tunante.desktop "dist/$NAME/" 2>/dev/null || true
          cp -r apps/tunante/dist/icons "dist/$NAME/" 2>/dev/null || true
          cp README.md LICENSE "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "$NAME.tar.gz"

      # Load-bearing, not a convenience: v0.1.283's updater looks for
      # Tunante_<v>_<amd64|aarch64>.AppImage by name and REPLACES ITS OWN
      # FILE with whatever it downloads, without checking what it got. A
      # release without these assets handed it the release web page and the
      # old install bricked itself. This is the bridge every old AppImage
      # crosses to the new player — and the new player's own updater swaps
      # $APPIMAGE with it from then on (see update.rs).
      - name: AppImage
        id: appimage
        if: github.event_name != 'pull_request'
        run: |
          NAME_ARCH=$([ "${{ matrix.arch }}" = "x86_64" ] && echo amd64 || echo "${{ matrix.arch }}")
          OUT="Tunante_${TUNANTE_VERSION:-dev}_${NAME_ARCH}.AppImage"
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp target/release/tunante target/release/tunante-decoder AppDir/usr/bin/
          cp apps/tunante/dist/icons/256x256/tunante.png AppDir/tunante.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Tunante' \
            'Comment=Game music player' 'Exec=tunante %F' 'Icon=tunante' \
            'Terminal=false' 'Categories=AudioVideo;Audio;Player;' \
            'StartupWMClass=tunante' > AppDir/tunante.desktop
          printf '%s\n' '#!/bin/sh' \
            '# Both binaries travel together; the player finds its decoder inside the image.' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export TUNANTE_DECODER="$HERE/usr/bin/tunante-decoder"' \
            'exec "$HERE/usr/bin/tunante" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run AppDir "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.tar.gz

      - name: Wait for this commit's tag
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          for _ in $(seq 1 30); do
            git fetch -q --tags origin 2>/dev/null || true
            TAG=$(git tag --points-at HEAD | head -1)
            [ -n "$TAG" ] && break
            echo "waiting for release.yml to tag this commit…"
            sleep 20
          done
          [ -n "$TAG" ] && echo "tag=$TAG" >> "$GITHUB_OUTPUT" || echo "no tag for this commit"

      # Same reasoning as the .apk below: an artifact needs an authenticated API
      # call and expires, a release asset can just be downloaded.
      - name: Attach it to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          [ -n "$TAG" ] || { echo "no tag; leaving the artifact as the only copy"; exit 0; }
          for _ in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG…"
            sleep 20
          done
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "release $TAG never appeared; leaving the artifact as the only copy"; exit 0; }
          gh release upload "$TAG" "${{ steps.pack.outputs.name }}.tar.gz" --clobber
          [ -f "${{ steps.appimage.outputs.name }}" ] && \
            gh release upload "$TAG" "${{ steps.appimage.outputs.name }}" --clobber
          echo "attached to $TAG"

  # Windows. MPRIS and logind are freedesktop, so the lock-screen controls and
  # the sleep inhibitor are compiled out here; everything else is the same code.
  windows:
    # Nothing to attach to if the release that triggered this one failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The commit the release was built from, not the tip of main.
          #
          # A workflow_run checkout defaults to the default branch's HEAD, and
          # main moves. It moved between the release starting and these jobs
          # running, so `git tag --points-at HEAD` found nothing and every
          # artifact was left unattached — a green run that shipped nothing.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # release.yml now commits the version bump and tags *that* commit, so the
      # commit the release was asked from (head_sha) is one behind the tag.
      # Move to the tag: the tree with the bumped version, and the one
      # `git tag --points-at HEAD` below will name. Newest tag as the fallback,
      # for a release that needed no bump commit and a main that moved since.
      - name: Move to the release's tag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch -q --tags origin main
          TAG=$(git tag --points-at origin/main | head -1)
          [ -z "$TAG" ] && TAG=$(git tag --sort=-creatordate | head -1)
          if [ -n "$TAG" ]; then
            git checkout -q "$TAG" && git submodule update -q --init --recursive 2>/dev/null || true
            echo "at $TAG ($(git rev-parse --short HEAD))"
          else
            echo "no tag to move to; staying on $(git rev-parse --short HEAD)"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: mini-windows
          cache-on-failure: true

      - name: Stamp the release version into the build
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git fetch -q --tags origin 2>/dev/null || true
          TAG=$(git tag --points-at HEAD | head -1)
          [ -n "$TAG" ] && echo "TUNANTE_VERSION=${TAG#v}" >> "$GITHUB_ENV" \
            || echo "no tag; building unstamped"

      - name: Build
        run: cargo build --release -p tunante -p tunante-decoder

      # The same bar as every other build of this app.
      - name: Music format smoke test
        run: cargo test --release -p tunante-codec -p tunante-decoder -- --nocapture

      # Both, and next to each other. The player looks for the decoder as a
      # sibling of itself and finds it by a name carrying EXE_SUFFIX, so the two
      # .exe files have to ship in one directory or nothing plays.
      - name: Zip
        id: pack
        shell: pwsh
        run: |
          $name = "tunante-x86_64-windows"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/tunante.exe    "dist/$name/"
          Copy-Item target/release/tunante-decoder.exe "dist/$name/"
          Copy-Item README.md, LICENSE                 "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip" -Force
          "name=$name" >> $env:GITHUB_OUTPUT
          Get-Item "$name.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.zip

      - name: Wait for this commit's tag
        id: tag
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            git fetch -q --tags origin 2>/dev/null || true
            TAG=$(git tag --points-at HEAD | head -1)
            [ -n "$TAG" ] && break
            echo "waiting for release.yml to tag this commit…"
            sleep 20
          done
          [ -n "$TAG" ] && echo "tag=$TAG" >> "$GITHUB_OUTPUT" || echo "no tag for this commit"

      - name: Attach it to the release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          [ -n "$TAG" ] || { echo "no tag; leaving the artifact as the only copy"; exit 0; }
          for _ in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG…"
            sleep 20
          done
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "release $TAG never appeared; leaving the artifact as the only copy"; exit 0; }
          gh release upload "$TAG" "${{ steps.pack.outputs.name }}.zip" --clobber
          echo "attached to $TAG"

  # How the phone actually builds it: Alpine's own rust, musl, aarch64.
  alpine:
    # Nothing to attach to if the release that triggered this one failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Native aarch64 rather than qemu. The vendored emulator cores are ~1.7 GB
    # of C; under emulation this job would take hours.
    runs-on: ubuntu-24.04-arm
    name: Alpine aarch64 (musl)

    # Alpine is a step here, not the job's container.
    #
    # `container: alpine:edge` is the obvious way to write this, and it fails
    # before compiling a line:
    #
    #     JavaScript Actions in Alpine containers are only supported on x64
    #     Linux runners. Detected Linux Arm64
    #
    # actions/checkout and actions/upload-artifact are JavaScript, and GitHub
    # ships a musl build of Node for x64 only. So the runner stays glibc and
    # does the checkout and the upload, and everything that needs musl runs
    # inside `docker run`.
    #
    # The script goes in on stdin rather than as an argument: quoted as an
    # argument it could not contain a single quote, which rules out an
    # apostrophe in a comment, and <<'ALPINE' also stops the host shell
    # expanding anything meant for the container.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The commit the release was built from, not the tip of main.
          #
          # A workflow_run checkout defaults to the default branch's HEAD, and
          # main moves. It moved between the release starting and these jobs
          # running, so `git tag --points-at HEAD` found nothing and every
          # artifact was left unattached — a green run that shipped nothing.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # release.yml now commits the version bump and tags *that* commit, so the
      # commit the release was asked from (head_sha) is one behind the tag.
      # Move to the tag: the tree with the bumped version, and the one
      # `git tag --points-at HEAD` below will name. Newest tag as the fallback,
      # for a release that needed no bump commit and a main that moved since.
      - name: Move to the release's tag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch -q --tags origin main
          TAG=$(git tag --points-at origin/main | head -1)
          [ -z "$TAG" ] && TAG=$(git tag --sort=-creatordate | head -1)
          if [ -n "$TAG" ]; then
            git checkout -q "$TAG" && git submodule update -q --init --recursive 2>/dev/null || true
            echo "at $TAG ($(git rev-parse --short HEAD))"
          else
            echo "no tag to move to; staying on $(git rev-parse --short HEAD)"
          fi
      - name: Build and test on Alpine
        env:
          # musl gives a thread 128 KiB where glibc gives megabytes, and the
          # emulator cores put deep interpreters on the stack. The main thread
          # keeps RLIMIT_STACK, so a core can work from main() and segfault the
          # moment it moves to a worker thread — which is what rodio does.
          RUSTFLAGS: -C link-arg=-Wl,-z,stack-size=8388608
        run: |
          docker run --rm -i \
            -v "$PWD":/src -w /src \
            -e CARGO_TERM_COLOR \
            -e RUSTFLAGS \
            -e "HOST_UID=$(id -u)" \
            -e "HOST_GID=$(id -g)" \
            alpine:edge sh -eux <<'ALPINE'
          apk add --no-cache \
            git tar \
            cargo rust cmake build-base musl-dev \
            fontconfig-dev alsa-lib-dev zlib-dev bsd-compat-headers

          # Alpine's rust, never rustup: rustup's musl target has crt-static on
          # by default, and this links dynamically against fontconfig and alsa.
          rustc --version

          # The tree was cloned by a different user on the host, and cargo shells
          # out to git for the vendored submodules that build.rs patches.
          git config --global --add safe.directory '*'

          # --no-default-features: no tray on the phone, no GTK in the image.
          cargo build --release --no-default-features -p tunante -p tunante-decoder

          # The bar for "no regression": every emulator backend opens a real
          # fixture and returns PCM that is not silence, and the out-of-process
          # decoder returns the same bytes as decoding in-process.
          cargo test --release -p tunante-codec -p tunante-decoder -- --nocapture

          # A static musl binary would build and then fail at runtime: Slint
          # needs dlopen and ALSA dlopens its PCM modules. Catch that here
          # rather than on the phone.
          for b in tunante tunante-decoder; do
            echo "== $b"
            ldd "target/release/$b" | grep -q ld-musl-aarch64 \
              || { echo "no está enlazado contra musl dinámicamente"; exit 1; }
          done

          # docker ran as root, so what it wrote is root-owned and the runner
          # user could not pick it up for the artifact.
          chown -R "$HOST_UID:$HOST_GID" target/release
          ALPINE

      - uses: actions/upload-artifact@v4
        with:
          name: tunante-aarch64-musl
          path: |
            target/release/tunante
            target/release/tunante-decoder
            apps/tunante/dist/

  package:
    # Nothing to attach to if the release that triggered this one failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # The recipe, run for real. Until this existed the APKBUILD had never been
    # executed once: it was a file that looked right.
    #
    # Here rather than on the phone because the recipe builds the whole
    # workspace, vendored C included. That is eight minutes on this runner and
    # the better part of an hour on the device at -j2 — on a charger that has
    # already browned the phone out three times.
    runs-on: ubuntu-24.04-arm
    name: Alpine package (aarch64)
    needs: alpine

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The commit the release was built from, not the tip of main.
          #
          # A workflow_run checkout defaults to the default branch's HEAD, and
          # main moves. It moved between the release starting and these jobs
          # running, so `git tag --points-at HEAD` found nothing and every
          # artifact was left unattached — a green run that shipped nothing.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The version comes from the tags, like everywhere else.
          fetch-depth: 0

      # release.yml now commits the version bump and tags *that* commit, so the
      # commit the release was asked from (head_sha) is one behind the tag.
      # Move to the tag: the tree with the bumped version, and the one
      # `git tag --points-at HEAD` below will name. Newest tag as the fallback,
      # for a release that needed no bump commit and a main that moved since.
      - name: Move to the release's tag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch -q --tags origin main
          TAG=$(git tag --points-at origin/main | head -1)
          [ -z "$TAG" ] && TAG=$(git tag --sort=-creatordate | head -1)
          if [ -n "$TAG" ]; then
            git checkout -q "$TAG" && git submodule update -q --init --recursive 2>/dev/null || true
            echo "at $TAG ($(git rev-parse --short HEAD))"
          else
            echo "no tag to move to; staying on $(git rev-parse --short HEAD)"
          fi
      # The same race tunante-android.yml lost the first time its attach step ran.
      #
      # release.yml creates the tag in its first job, which can finish after
      # this job has checked out, so `git describe --tags` returns whichever tag
      # this clone happens to know -- the previous release's. This workflow has
      # been getting away with it because its build is slow enough that the tag
      # has always arrived by the time it looks. That is luck, and an apk
      # labelled with the wrong version cannot be told from a good one later.
      - name: Wait for this commit's tag
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          for _ in $(seq 1 30); do
            git fetch -q --tags origin 2>/dev/null || true
            TAG=$(git tag --points-at HEAD | head -1)
            [ -n "$TAG" ] && break
            echo "esperando a que release.yml etiquete este commit…"
            sleep 20
          done
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "este commit es $TAG"
          else
            echo "no ha aparecido etiqueta para este commit"
          fi

      - name: The recipe is a shell script, so check it parses as one
        # Un segundo, y habría ahorrado diez minutos de runner: un comentario
        # dentro de la cadena de `makedepends` cerró las comillas a media lista
        # y el resto de la receta se ejecutó como órdenes sueltas.
        run: sh -n apps/tunante/dist/APKBUILD

      - name: Build the apk
        run: |
          VERSION=$(echo "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
          VERSION=${VERSION:-0.1.0}
          echo "empaquetando $VERSION"

          # A tarball of this checkout, laid out exactly as GitHub's release
          # archive would be, so `builddir` in the recipe finds what it expects.
          # git archive is no good here: it does not carry submodules, and the
          # emulator cores are submodules.
          mkdir -p /tmp/src
          tar czf "/tmp/src/tunante-$VERSION.tar.gz" \
            --exclude=.git --exclude=target --exclude=node_modules \
            --transform "s,^\.,tunante-$VERSION," .

          docker run --rm -i \
            -v "$PWD":/repo -v /tmp/src:/src -v "$PWD/out":/out \
            -e "VERSION=$VERSION" \
            alpine:edge sh -eux <<'ALPINE'
          apk add --no-cache alpine-sdk sudo

          # abuild refuses to run as root, so it gets a user of its own.
          adduser -D empaqueta
          addgroup empaqueta abuild
          echo 'empaqueta ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          mkdir -p /home/empaqueta/recipe /var/cache/distfiles
          chgrp abuild /var/cache/distfiles && chmod g+w /var/cache/distfiles

          cp /repo/apps/tunante/dist/APKBUILD /home/empaqueta/recipe/
          # Stamp the version, exactly as release.yml does for the tree.
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" /home/empaqueta/recipe/APKBUILD
          chown -R empaqueta:empaqueta /home/empaqueta

          # The tarball goes into the distfiles cache under the name the recipe
          # asks for. abuild checks the cache before fetching, so the `source=`
          # URL stays as it is for a real release and nothing is downloaded.
          cp "/src/tunante-$VERSION.tar.gz" /var/cache/distfiles/
          chgrp abuild "/var/cache/distfiles/tunante-$VERSION.tar.gz"

          su empaqueta -c 'cd ~/recipe && abuild-keygen -a -n'

          # La clave pública, a mano y como root.
          #
          # `abuild-keygen -a` dice que la instala y en su propia salida avisa de
          # que hay que copiarla a /etc/apk/keys. Sin eso, el último paso de
          # `abuild -r` —crear el índice del repositorio— rechaza el paquete que
          # el propio abuild acaba de firmar: "UNTRUSTED signature".
          cp /home/empaqueta/.config/abuild/*.rsa.pub /etc/apk/keys/

          su empaqueta -c '
            set -eux
            cd ~/recipe
            # Contra el tarball que acabamos de dejar en la caché, que no es el
            # de la release y por tanto no tiene su misma suma.
            abuild checksum
            abuild -r
          '

          # Searched for, not guessed at — and from the home directory, not
          # from "packages".
          #
          # abuild leaves the package in $REPODEST/<repo>/<arch>, and <repo> is
          # the name of the PARENT of the directory holding the APKBUILD — here
          # "empaqueta", not "recipe". A hand-written path matched nothing, the
          # shell passed the pattern through, and cp complained about a literal
          # asterisk.
          #
          # REPODEST is not $HOME/packages either: recent abuild uses XDG paths,
          # so $HOME/.local/share/abuild. Searching the home directory covers
          # both. The build itself finished fine and the job died here, on the
          # very last step, with "No such file or directory".
          mkdir -p /out
          find /home/empaqueta -name '*.apk' -exec cp {} /out/ \;
          # Without this, the failure surfaces further down as an unexpanded
          # asterisk, which reads like anything but "there is no package".
          [ -n "$(ls -A /out)" ] || { echo "abuild produced no .apk"; exit 1; }
          # The container is root and /out is bind-mounted from the host:
          # without this the runner's user cannot read them to upload.
          chmod a+r /out/*.apk
          ls -l /out
          ALPINE

      - name: What is inside it
        run: |
          for f in out/*.apk; do
            echo "== $f  ($(stat -c%s "$f") bytes)"
            # An apk is a gzipped tar; this is the whole point of the job —
            # seeing that the recipe actually installs the binaries and the
            # launcher entry, not just that it exited zero.
            tar tzf "$f" | grep -v '^\.SIGN\|^\.PKGINFO' | sed 's/^/   /'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tunante-alpine-aarch64
          path: out/*.apk

      # And onto the release, so the package is installable without a GitHub
      # account.
      #
      # An artifact is not a download: it needs an authenticated API call and it
      # expires. The phone's setup script has to be able to `wget` this, which
      # means a release asset.
      #
      # Attached to the tag rather than to a rolling "latest": that tag is the
      # code this apk was built from, and `release.yml` pushes it in its first
      # job, minutes before this one gets here. Note this workflow is path
      # filtered, so not every release carries an apk — whoever fetches it has
      # to ask for the newest release that *has* one, not the newest release.
      - name: Attach it to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "no tag for this commit; leaving the artifact as the only copy"
            exit 0
          fi

          # release.yml creates the release after its three desktop builds, so
          # it can still be in flight when this finishes. Wait rather than fail:
          # the alternative is a release that is missing its phone package for
          # no better reason than job ordering.
          for _ in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG…"
            sleep 20
          done

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG never appeared; leaving the artifact as the only copy"
            exit 0
          fi

          gh release upload "$TAG" out/*.apk --clobber
          echo "attached to $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
