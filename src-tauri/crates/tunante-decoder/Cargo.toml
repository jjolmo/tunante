[package]
name = "tunante-decoder"
version = "0.1.0"
edition = "2021"
description = "Out-of-process decoder helper: turns a file into PCM, or into metadata"
license = "GPL-2.0-or-later"

[[bin]]
name = "tunante-decoder"
path = "src/main.rs"

[dependencies]
tunante-core = { path = "../tunante-core", default-features = false }
tunante-codec = { path = "../tunante-codec" }
rodio = { version = "0.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
