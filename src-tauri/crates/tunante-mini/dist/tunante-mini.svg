<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tunante mini. The palette is the app's own (src/app.css): dark shell,
       accent blue. A cartridge, because that is what this player is for. -->
  <rect width="64" height="64" rx="14" fill="#1e1e1e"/>
  <rect x="14" y="10" width="36" height="44" rx="4" fill="#2d2d30" stroke="#3e3e42" stroke-width="2"/>
  <!-- Label -->
  <rect x="20" y="16" width="24" height="16" rx="2" fill="#252526"/>
  <!-- Contacts along the bottom, the part everyone recognises -->
  <rect x="22" y="44" width="3" height="7" fill="#007acc"/>
  <rect x="27" y="44" width="3" height="7" fill="#007acc"/>
  <rect x="32" y="44" width="3" height="7" fill="#007acc"/>
  <rect x="37" y="44" width="3" height="7" fill="#007acc"/>
  <!-- A quaver over the label -->
  <g fill="#cccccc">
    <ellipse cx="27" cy="27.5" rx="3.6" ry="2.9" transform="rotate(-20 27 27.5)"/>
    <rect x="29.6" y="15.5" width="1.9" height="11.5"/>
    <path d="M31.5 15.5c4.2 1.1 6.4 3 6.6 6.1-1.4-2.4-3.6-3.6-6.6-3.8z"/>
  </g>
</svg>
